[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[fmt]
line_length = 120
tab_width = 4
