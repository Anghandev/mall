[profile.default]
src = "contracts"
test = "test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"
]

[fmt]
line_length = 120
tab_width = 4
