location = / {
    return 301 /mall/;
}

location = /shop {
    return 301 /mall/mall;
}

location = /stores {
    return 301 /mall/stores;
}

location = /seckill {
    return 301 /mall/seckill;
}

location = /mall {
    return 301 /mall/;
}

location = /mall/assets {
    root /var/opt/abu24k/current;
    try_files /mall/index.html =404;
}

location = /mall/assets/ {
    root /var/opt/abu24k/current;
    try_files /mall/index.html =404;
}

location ^~ /mall/ {
    root /var/opt/abu24k/current;
    try_files $uri $uri/ /mall/index.html;
}

location = /merchant {
    return 301 /merchant/;
}

location = /merchant/assets {
    root /var/opt/abu24k/current;
    try_files /merchant/index.html =404;
}

location = /merchant/assets/ {
    root /var/opt/abu24k/current;
    try_files /merchant/index.html =404;
}

location ^~ /merchant/ {
    root /var/opt/abu24k/current;
    try_files $uri $uri/ /merchant/index.html;
}

location = /platform {
    return 301 /platform/;
}

location ^~ /platform/ {
    root /var/opt/abu24k/current;
    try_files $uri $uri/ /platform/index.html;
}

location = /block-burst/rpc {
    limit_except POST { deny all; }
    proxy_pass https://bsc-dataseed.binance.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host bsc-dataseed.binance.org;
    proxy_set_header Content-Type application/json;
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "https://www.npleon.com" always;
    add_header Cache-Control "no-store" always;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location = /block-burst {
    return 301 /mall/block-blast;
}

location = /block-burst/ {
    return 301 /mall/block-blast;
}

location = /block-burst/assets {
    return 404;
}

location = /block-burst/assets/ {
    return 404;
}

location ^~ /block-burst/assets/ {
    root /var/opt/abu24k/current;
    try_files $uri =404;
}

location = /block-burst/admin {
    return 301 /block-burst/admin/;
}

location ^~ /block-burst/admin/ {
    root /var/opt/abu24k/current;
    try_files /block-burst/index.html =404;
}

location ^~ /block-burst/ {
    return 301 /mall/block-blast;
}

location = /core {
    return 301 /core/;
}

location ^~ /core/ {
    proxy_pass http://127.0.0.1:8788/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location ~ ^/media-v2/upload/[A-Za-z0-9_.-]+$ {
    access_log off;
    client_max_body_size 10m;
    limit_except PUT { deny all; }
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location ~ ^/media-v2/read/[A-Za-z0-9_.-]+$ {
    access_log off;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
}
